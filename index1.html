let driving=false,harvested=false,coins=0,yaw=0,move={x:0,y:0},turn=0,phase=0;
const stick=document.getElementById('stick'),nub=document.getElementById('nub'),act=document.getElementById('act'),msg=document.getElementById('msg');
let pointer=null;
function preventSelection(e){e.preventDefault()}
for(const ev of ['contextmenu','selectstart','dragstart'])document.addEventListener(ev,preventSelection,{passive:false});
// touch-action:none ve pointer olayları Safari seçimini engeller; touchstart iptali click olayını bozuyordu.
function setJoy(e){const r=stick.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,len=Math.max(1,Math.hypot(dx,dy)),f=Math.min(1,len/48);
 // Parmağı yukarı = ileri (+Z); sağ = sağ. Kamera açısı ile hareket yönü uyumlu.
 move.x=dx/len*f;move.y=-dy/len*f;
 nub.style.transform=`translate(${move.x*45}px,${-move.y*45}px)`;
}
stick.addEventListener('pointerdown',e=>{e.preventDefault();pointer=e.pointerId;stick.setPointerCapture(pointer);setJoy(e)});
stick.addEventListener('pointermove',e=>{if(pointer===e.pointerId){e.preventDefault();setJoy(e)}});
function end(e){if(e.pointerId===pointer){pointer=null;move.x=move.y=0;nub.style.transform=''}}
for(const ev of ['pointerup','pointercancel','lostpointercapture'])stick.addEventListener(ev,end);
let pressedTurn=new Set();
function bind(id,val){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();pressedTurn.add(val);b.setPointerCapture(e.pointerId)});
 for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>pressedTurn.delete(val));}
bind('left',-1);bind('right',1);
let actionPointer=null;
function doAction(){
 if(driving){driving=false;farmer.visible=true;farmer.position.copy(tractor.position).add(new T.Vector3(2,0,0));farmer.rotation.y=yaw;act.textContent='ETKİLEŞ';msg.textContent='Traktörden indin';}
 else if(farmer.position.distanceTo(tractor.position)<5){driving=true;farmer.visible=false;act.textContent='İN';msg.textContent='🚜 Traktörü sür · Tarlaya git';}
 else msg.textContent='Traktöre yaklaş ve ETKİLEŞ düğmesine bas';
}

// Traktörde direksiyon ve tekerlek yuvarlanması, araç ilerleme mesafesine bağlı.
let lastPos=new T.Vector3();
const clock=new T.Clock();
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.045),speed=driving?6.5:3.5;
 turn=(pressedTurn.has(1)?1:0)-(pressedTurn.has(-1)?1:0);
 yaw+=(driving?-turn:turn)*dt*1.6; // Traktörün kamera yönüne göre sağ/sol dönüşünü düzelt; çiftçi aynı kalır
 const p=driving?tractor:farmer;
 const forward=move.y,strafe=-move.x; // iPhone ekranında sağa itince sağa gitmesi için
 // Kamera karakterin arkasındadır: yukarı ileri, aşağı geri, sağ sağa, sol sola.
 const vx=(Math.sin(yaw)*forward+Math.cos(yaw)*strafe)*speed*dt;
 const vz=(Math.cos(yaw)*forward-Math.sin(yaw)*strafe)*speed*dt;
 lastPos.copy(p.position);
 p.position.x=Math.max(-32,Math.min(32,p.position.x+vx));p.position.z=Math.max(-32,Math.min(32,p.position.z+vz));
 p.rotation.y=yaw;
 const distance=p.position.distanceTo(lastPos);
 if(!driving){
   const walking=Math.min(1,Math.hypot(forward,strafe));phase+=dt*10*walking;
   legL.rotation.x=Math.sin(phase)*.55*walking;legR.rotation.x=-Math.sin(phase)*.55*walking;
   armL.rotation.x=-Math.sin(phase)*.43*walking;armR.rotation.x=Math.sin(phase)*.43*walking;
   legL.position.y=.39+Math.max(0,Math.sin(phase))*.07*walking;
   legR.position.y=.39+Math.max(0,-Math.sin(phase))*.07*walking;
 }else{
   for(let i=0;i<wheels.length;i++){
     wheelSpin[i]+=(forward*speed*dt)/(i<2?.67:.45);
     wheels[i].userData.spin.rotation.x=wheelSpin[i]
   }
   const steerAngle=Math.max(-.42,Math.min(.42,-turn*.32-strafe*.2));
   for(const w of frontSteer)w.rotation.y=steerAngle;
 }
 if(driving&&!harvested&&Math.abs(p.position.x-9)<4.8&&Math.abs(p.position.z-9)<4.8){
   harvested=true;crops.forEach(c=>c.visible=false);coins+=50;
   document.getElementById('money').textContent='🪙 '+coins+' altın · 3D Köy V9';
   msg.textContent='🌾 HASAT BAŞARILI! +50 ALTIN · TOPLAM: '+coins;
 }
 const target=new T.Vector3(p.position.x,driving?1.6:1.55,p.position.z);
 const offset=new T.Vector3(-Math.sin(yaw)*7.7,3.15,-Math.cos(yaw)*7.7);
 camera.position.lerp(target.clone().add(offset),.12);camera.lookAt(target);
 renderer.render(scene,camera);
}
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
document.getElementById('loading').style.display='none';frame();}catch(e){error('3D başlatma hatası: '+e.message)}})();
